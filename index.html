const domeMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
  uniforms: { uColor: { value: new THREE.Color(0x33ddff) }, uHitDir: { value: new THREE.Vector3(0, 1, 0) }, uHit: { value: 0 } },
  vertexShader: `varying vec3 vN; varying vec3 vW; varying vec3 vL;
    void main(){
      vL = normalize(position);
      vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz;
      vN = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * viewMatrix * w;
    }`,
  fragmentShader: `uniform vec3 uColor; uniform vec3 uHitDir; uniform float uHit;
    varying vec3 vN; varying vec3 vW; varying vec3 vL;
    void main(){
      vec3 V = normalize(cameraPosition - vW);
      float fres = pow(1.0 - abs(dot(normalize(vN), V)), 3.0);

      float ripple = uHit * (exp(-d * 5.0) + smoothstep(0.1, 0.0, abs(d - (1.0 - uHit) * 1.4)) * 0.8);

      vec3 c = mix(uColor, vec3(1.0, 0.25, 0.35), clamp(ripple * 1.5, 0.0, 1.0));

});

// ============================================================================
// Canvas panels (HUD + announcements)

function makePanel(w, h, cw, ch) {
  const canvas = document.createElement('canvas'); canvas.width = cw; canvas.height = ch;
  const ctx = canvas.getContext('2d');
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, fog: false }));
  mesh.renderOrder = 10;
  return { canvas, ctx, tex, mesh };
}
function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function txt(ctx, s, x, y, size, color, align = 'left', glow = 0) {
  ctx.font = `800 ${size}px "Segoe UI", system-ui, sans-serif`;
  ctx.textAlign = align; ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = glow;
  ctx.fillText(s, x, y); ctx.shadowBlur = 0;
}
function bar(ctx, x, y, w, h, frac, color) {
  rrect(ctx, x, y, w, h, h / 2); ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 2; ctx.stroke();
  if (frac > 0.01) {
    rrect(ctx, x, y, w * frac, h, Math.min(h / 2, (w * frac) / 2));
    ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 16; ctx.fill(); ctx.shadowBlur = 0;
  }
}

// ============================================================================
// Audio (all synthesized, no asset files)
// ============================================================================
let actx = null, master = null, musicGain = null, noiseBuf = null;
let nextNoteTime = 0, stepIdx = 0, barIdx = 0;

function audio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; }
    master = actx.createGain(); master.gain.value = 0.55; master.connect(actx.destination);
    musicGain = actx.createGain(); musicGain.gain.value = 0.2; musicGain.connect(master);
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    nextNoteTime = actx.currentTime + 0.1;
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(type, f0, f1, dur, vol, dest = master, when = actx.currentTime) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, when);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), when + dur);
  g.gain.setValueAtTime(vol, when);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g).connect(dest);
  o.start(when); o.stop(when + dur + 0.02);
}
function noise(dur, vol, freq, dest = master, when = actx.currentTime) {
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(freq, when);
  f.frequency.exponentialRampToValueAtTime(Math.max(60, freq * 0.15), when + dur);
  const g = actx.createGain();
  g.gain.setValueAtTime(vol, when);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  s.connect(f).connect(g).connect(dest);
  s.start(when); s.stop(when + dur);
}
const sfx = {
  shoot(i) { tone('square', i ? 900 : 760, 170, 0.11, 0.09); },
  hit() { tone('triangle', 1500, 900, 0.06, 0.14); },
  explode(big) { noise(big ? 1.3 : 0.45, big ? 0.9 : 0.45, big ? 2500 : 4200); tone('sine', big ? 130 : 210, 40, big ? 0.9 : 0.3, 0.45); },
  baseHit() { tone('sawtooth', 110, 38, 0.5, 0.35); noise(0.4, 0.4, 900); },
  playerHit() { tone('square', 320, 60, 0.35, 0.3); noise(0.2, 0.3, 3000); },
  orb() { tone('sine', 280, 900, 0.25, 0.12); },
  nova() { tone('sawtooth', 70, 1600, 0.7, 0.3); noise(1.1, 0.6, 6000); },
  denied() { tone('square', 160, 150, 0.12, 0.12); },
  wave() { [0, 4, 7, 12].forEach((s, i) => tone('square', 440 * 2 ** (s / 12), 440 * 2 ** (s / 12), 0.14, 0.1, master, actx.currentTime + i * 0.09)); },
  gameover() { [12, 7, 3, 0, -5].forEach((s, i) => tone('sawtooth', 220 * 2 ** (s / 12), 200 * 2 ** (s / 12), 0.35, 0.15, master, actx.currentTime + i * 0.18)); },
};
function play(name, ...args) { if (!actx) return; try { sfx[name](...args); } catch {} }

// Tiny step sequencer: Am - F - C - G synthwave bassline + drums
const ROOTS = [0, -4, 3, -2];
const BASS = [0, 0, 12, 0, 0, 0, 10, 0, 0, 0, 12, 0, 7, 0, 5, 3];
function bassNote(freq, when, dur) {
  const o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain();
  o.type = 'sawtooth'; o.frequency.value = freq;
  f.type = 'lowpass'; f.frequency.setValueAtTime(1400, when); f.frequency.exponentialRampToValueAtTime(200, when + dur);
  g.gain.setValueAtTime(0.5, when); g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(f).connect(g).connect(musicGain);
  o.start(when); o.stop(when + dur + 0.02);
}
function scheduleMusic() {
  if (!actx || actx.state !== 'running') return;
  const step = 60 / 124 / 4;
  if (nextNoteTime < actx.currentTime - 0.5) nextNoteTime = actx.currentTime + 0.05;
  while (nextNoteTime < actx.currentTime + 0.15) {
    const t = nextNoteTime, root = ROOTS[barIdx % 4];
    if (stepIdx % 2 === 0 || BASS[stepIdx] !== 0) bassNote(55 * 2 ** ((root + BASS[stepIdx]) / 12), t, step * 0.9);
    if (stepIdx % 4 === 0) tone('sine', 150, 40, 0.16, 0.8, musicGain, t);
    if (state.mode === 'playing' && stepIdx % 4 === 2) noise(0.05, 0.25, 9000, musicGain, t);
    if (state.mode === 'playing' && stepIdx % 8 === 4) noise(0.18, 0.35, 3500, musicGain, t);
    nextNoteTime += step;
    stepIdx = (stepIdx + 1) % 16;
    if (stepIdx === 0) barIdx++;
  }
}
addEventListener('pointerdown', audio);
addEventListener('keydown', audio);

// ============================================================================
// Controllers: a blaster in each hand
// ============================================================================
function makeBlaster(color) {
  const g = new THREE.Group();
  const dark = new THREE.MeshPhongMaterial({ color: 0x2b2b3a, shininess: 90, flatShading: true });
  const glow = new THREE.MeshBasicMaterial({ color });
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.06, 0.17), dark); body.position.set(0, -0.012, 0.02);
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.013, 0.018, 0.14, 12), dark); barrel.rotation.x = Math.PI / 2; barrel.position.z = -0.1;
  const strip = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.012, 0.12), glow); strip.position.set(0, 0.022, 0.0);

function explode(pos, color, count = 40, speed = 6, size = 0.2, life = 0.9) {

  }

  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

function flash(pos, color, size) {

  m.position.copy(pos);

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {

    if (p.life <= 0) {
      scene.remove(p.pts); p.pts.geometry.dispose(); p.pts.material.dispose();
      particles.splice(i, 1); continue;

    const arr = p.pts.geometry.attributes.position.array, v = p.vels, drag = Math.max(0, 1 - 2.2 * dt);
    for (let j = 0; j < arr.length; j += 3) {

// ============================================================================
// Game flow
// ============================================================================
function clearField() {
  for (const e of enemies) removeEnemy(e);
  enemies.length = 0;
  for (const b of bolts) scene.remove(b.mesh);
  bolts.length = 0;
}

function startGame() {
  clearField();
  Object.assign(state, {
    mode: 'playing', modeTime: 0, score: 0, wave: 0, coreHP: MAX_HP, nova: 100,
    comboCount: 0, mult: 1, comboTimer: 0, boss: null, bossPending: false, newHigh: false,
  });
  core.visible = true;
  nextWave();
}

function nextWave() {
  state.wave++;
  const w = state.wave;
  state.bossPending = w % 5 === 0;
  state.toSpawn = state.bossPending ? 3 + w : 6 + Math.floor(w * 2.5);
  state.spawnInterval = Math.max(0.35, 1.5 - w * 0.09);
  state.spawnTimer = 0;
  state.waveBreak = 3;
  const sub = w === 1 ? 'DEFEND THE CORE' : `WAVE CLEARED  ·  CORE +12  ·  BONUS +${(w - 1) * 500}`;
  announce(`WAVE ${w}`, sub);
  play('wave');
}

function waveCleared() {
  state.coreHP = Math.min(MAX_HP, state.coreHP + 12);
  state.score += state.wave * 500;
  nextWave();
}

function gameOver() {
  state.mode = 'gameover';
  state.modeTime = 0;
  explode(CORE_POS, 0x66ffff, 220, 16, 0.3, 1.6);
  flash(CORE_POS, 0x66ffff, 12);
  for (const e of enemies) { if (!e.dead) explode(e.mesh.position, e.def.color, 30, 6); }
  clearField();
  core.visible = false;
  if (state.score > state.high) { state.high = state.score; state.newHigh = true; saveHigh(state.high); }
  announce('CORE DESTROYED', `FINAL SCORE ${state.score.toLocaleString()}`, '#ff4466');
  play('explode', true);
  play('gameover');
  pulseAll(1, 600);
}

function updateGame(dt) {
  if (state.mode !== 'playing') return;
  if (state.comboTimer > 0) {
    state.comboTimer -= dt;
    if (state.comboTimer <= 0) { state.comboCount = 0; state.mult = 1; }
  }
  if (state.waveBreak > 0) {
    state.waveBreak -= dt;
    if (state.waveBreak <= 0 && state.bossPending) { spawnBoss(); state.bossPending = false; }
  } else if (state.toSpawn > 0) {
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0) {
      spawnEnemy(pickType(state.wave), spawnPos());
      state.toSpawn--;
      state.spawnTimer = state.spawnInterval * (0.6 + Math.random() * 0.8);
    }
  } else if (!state.bossPending && enemies.every(e => e.dead || e.type === 'orb')) {
    waveCleared();
  }
}

function updateNova(dt) {
  if (!nova) return;
  nova.t += dt;
  const k = nova.t / 0.7;
  const r = DOME_R + nova.t * 65;
  novaSphere.scale.setScalar(r);
  novaRing.scale.setScalar(r);
  novaSphere.material.opacity = 0.25 * (1 - k);
  novaRing.material.opacity = 0.9 * (1 - k);
  for (const e of enemies) {
    if (e.dead || nova.hit.has(e)) continue;
    if (e.mesh.position.distanceTo(DOME_CENTER) < r) {
      nova.hit.add(e);
      if (e.type === 'boss') damageEnemy(e, 12, null); else killEnemy(e, null);
    }
  }
  if (k >= 1) { nova = null; novaSphere.visible = novaRing.visible = false; }
}

// ============================================================================
// HUD
// ============================================================================
const RADAR_COLORS = {};
for (const k in ENEMY) RADAR_COLORS[k] = '#' + new THREE.Color(ENEMY[k].color).getHexString();

function drawHUD() {
  const { ctx, tex } = hud, W = 1024, H = 512;
  ctx.clearRect(0, 0, W, H);
  rrect(ctx, 6, 6, W - 12, H - 12, 28);
  ctx.fillStyle = 'rgba(8, 0, 30, 0.6)'; ctx.fill();
  ctx.strokeStyle = 'rgba(80, 255, 255, 0.8)'; ctx.lineWidth = 4;
  ctx.shadowColor = '#3ff'; ctx.shadowBlur = 18; ctx.stroke(); ctx.shadowBlur = 0;
  const blink = Math.floor(performance.now() / 450) % 2 === 0;

  if (state.mode === 'menu') {
    txt(ctx, 'CORE DEFENDER', W / 2, 115, 100, '#5ff', 'center', 30);
    txt(ctx, 'V R   B A S E   D E F E N S E', W / 2, 168, 30, '#f6c', 'center', 10);
    const lines = [
      'Drones are diving at the energy core above you.',
      'TRIGGER  —  fire blasters  (hold for auto-fire)',
      'GRIP  —  NOVA shockwave when the meter is full',
      'Green sentinels shoot red orbs at you: shoot or dodge!',
    ];
    lines.forEach((l, i) => txt(ctx, l, W / 2, 238 + i * 44, 30, '#d8f4ff', 'center'));
    if (blink) txt(ctx, 'PULL TRIGGER TO START', W / 2, 438, 48, '#ffd24a', 'center', 18);
    txt(ctx, `HIGH SCORE  ${state.high.toLocaleString()}`, W / 2, 485, 28, '#f6c', 'center');
  } else if (state.mode === 'playing') {
    txt(ctx, 'SCORE', 44, 66, 28, '#9ff');
    txt(ctx, state.score.toLocaleString(), 44, 140, 76, '#fff', 'left', 16);
    txt(ctx, `WAVE ${state.wave}`, 44, 198, 40, '#f6c', 'left', 10);
    if (state.mult > 1) txt(ctx, `x${state.mult} COMBO`, 260, 198, 40, '#ffd24a', 'left', 14);

    const hp = state.coreHP / MAX_HP;
    const hpColor = hp > 0.6 ? '#4f8' : hp > 0.3 ? '#fd4' : '#f45';
    txt(ctx, `CORE  ${Math.ceil(state.coreHP)}%`, 44, 262, 28, hpColor);
    bar(ctx, 44, 276, 560, 32, hp, hpColor);
    const ready = state.nova >= 100;
    txt(ctx, ready ? 'NOVA READY — SQUEEZE GRIP' : `NOVA  ${Math.floor(state.nova)}%`, 44, 352, 28, ready && blink ? '#fff' : '#5ff');
    bar(ctx, 44, 366, 560, 32, state.nova / 100, ready ? '#aff' : '#3cf');

    if (state.boss) {
      txt(ctx, 'MOTHERSHIP', 44, 442, 28, '#f47');
      bar(ctx, 44, 456, 936, 24, Math.max(0, state.boss.hp / state.boss.maxHp), '#f47');
    }

    // Radar: up = straight ahead
    const cx = 815, cy = 220, r = 165;
    ctx.strokeStyle = 'rgba(80,255,255,0.45)'; ctx.lineWidth = 2;
    for (const rr of [r, r * 0.66, r * 0.33]) { ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy); ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r); ctx.stroke();
    camera.getWorldDirection(_v1);
    const a = Math.atan2(_v1.x, -_v1.z) - Math.PI / 2;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, a - 0.55, a + 0.55); ctx.closePath();
    ctx.fillStyle = 'rgba(80,255,255,0.12)'; ctx.fill();
    for (const e of enemies) {
      if (e.dead) continue;
      let x = e.mesh.position.x / RADAR_RANGE, y = e.mesh.position.z / RADAR_RANGE;
      const l = Math.hypot(x, y);
      if (l > 1) { x /= l; y /= l; }
      ctx.beginPath();
      ctx.arc(cx + x * r, cy + y * r, e.type === 'boss' ? 14 : e.type === 'orb' ? 4 : 7, 0, Math.PI * 2);
      ctx.fillStyle = RADAR_COLORS[e.type]; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 10; ctx.fill(); ctx.shadowBlur = 0;
    }
    ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2); ctx.fillStyle = '#5ff'; ctx.fill();
    txt(ctx, 'RADAR', cx, cy + r + 34, 24, '#9ff', 'center');
  } else {
    txt(ctx, 'CORE DESTROYED', W / 2, 110, 92, '#f46', 'center', 28);
    txt(ctx, `SCORE  ${state.score.toLocaleString()}`, W / 2, 200, 60, '#fff', 'center', 12);
    txt(ctx, `REACHED WAVE ${state.wave}`, W / 2, 260, 36, '#f6c', 'center');
    if (state.newHigh) { if (blink) txt(ctx, '★ NEW HIGH SCORE ★', W / 2, 330, 46, '#ffd24a', 'center', 18); }
    else txt(ctx, `HIGH SCORE  ${state.high.toLocaleString()}`, W / 2, 330, 36, '#9ff', 'center');
    if (state.modeTime > 1.5 && blink) txt(ctx, 'PULL TRIGGER TO PLAY AGAIN', W / 2, 440, 46, '#ffd24a', 'center', 18);
  }
  tex.needsUpdate = true;
}

// ============================================================================
// Main loop
// ============================================================================
const clock = new THREE.Clock();
let hudTimer = 0;

function loop() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;
  state.modeTime += dt;
  camera.getWorldPosition(headPos);

  scheduleMusic();

  // Weapons
  for (const c of controllers) {
    c.userData.cool -= dt;
    if (c.userData.trigger && state.mode === 'playing' && c.userData.cool <= 0) {
      shootFromController(c);
      c.userData.cool = FIRE_INTERVAL;
    }
    const b = c.userData.blaster.userData;
    b.recoil = Math.max(0, b.recoil - dt * 10);
    c.userData.blaster.position.z = b.recoil * 0.03;
    c.userData.blaster.rotation.x = b.recoil * 0.12;
    if (state.mode === 'playing' && state.nova >= 100) {
      b.glow.color.copy(b.baseColor).lerp(_v3c.set(1, 1, 1), 0.5 + Math.sin(time * 10) * 0.5);
    } else b.glow.color.copy(b.baseColor);
  }
  desktopCool -= dt;
  if (desktopFiring && !renderer.xr.isPresenting && state.mode === 'playing' && desktopCool <= 0) {
    shootFromDesktop();
    desktopCool = FIRE_INTERVAL;
  }

  updateGame(dt);
  updateEnemies(dt);
  updateBolts(dt);
  updateNova(dt);
  updateParticles(dt);

  // Core visuals
  const hp = state.coreHP / MAX_HP;
  coreFlash = Math.max(0, coreFlash - dt * 3);
  coreMesh.rotation.y += dt * 0.8;
  coreRingA.rotation.x = time * 0.9; coreRingA.rotation.y = time * 0.5;
  coreRingB.rotation.x = -time * 0.6; coreRingB.rotation.z = time * 0.7;
  const coreCol = _v3c.setHSL(0.5 * hp, 1, 0.55).lerp(new THREE.Color(1, 1, 1), coreFlash);
  coreMat.emissive.copy(coreCol);
  coreGlow.material.color.copy(coreCol);
  coreGlow.scale.setScalar(1 + Math.sin(time * (3 + (1 - hp) * 8)) * 0.08 + coreFlash * 0.5);
  coreLight.color.copy(coreCol);
  coreLight.intensity = core.visible ? 6 + coreFlash * 20 : 0;
  core.position.y = CORE_POS.y + Math.sin(time * 1.2) * 0.08;
  domeMat.uniforms.uHit.value = Math.max(0, domeMat.uniforms.uHit.value - dt * 1.3);
  domeMat.uniforms.uColor.value.setHSL(0.52 * Math.max(hp, 0.05), 1, 0.55);

  vignette.material.opacity = Math.max(0, vignette.material.opacity - dt * 1.5);
  vignette.visible = vignette.material.opacity > 0.01;

  if (bannerLife > 0) {
    bannerLife -= dt;
    banner.mesh.material.opacity = Math.min(1, bannerLife * 2);
    banner.mesh.scale.setScalar(1 + Math.max(0, bannerLife - 2.3) * 0.6);
    if (bannerLife <= 0) banner.mesh.visible = false;
  }

  hudTimer -= dt;
  if (hudTimer <= 0) { drawHUD(); hudTimer = 0.15; }

  renderer.render(scene, camera);
}
renderer.setAnimationLoop(loop);
</script>
