name: Build Thunderforge

on:
  push:
    paths:
      - 'thunderforge/**'
      - '.github/workflows/thunderforge.yml'
  pull_request:
    paths:
      - 'thunderforge/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: thunderforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: thunderforge
          path: thunderforge/build/libs/*.jar
